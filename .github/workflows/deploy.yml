name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  SERVICE_NAME: wi-tp
  REGION: europe-west1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required so the job can mint the OIDC token WIF exchanges
    steps:
      - uses: actions/checkout@v4

      # Workload Identity Federation: no key file ever touches the runner.
      # See the setup commands from earlier for how WIF_PROVIDER and
      # WIF_SERVICE_ACCOUNT get created.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          source: .
          # Repo secrets are named GH_OAUTH_* rather than GITHUB_OAUTH_* —
          # GitHub Actions reserves the GITHUB_ prefix for its own secrets,
          # so a repo secret can't use it. The app's env var name (left
          # side) is unaffected.
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            GITHUB_OAUTH_CLIENT_ID=${{ secrets.GH_OAUTH_CLIENT_ID }}
            GITHUB_OAUTH_CLIENT_SECRET=${{ secrets.GH_OAUTH_CLIENT_SECRET }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            TOKEN_ENCRYPTION_KEY=${{ secrets.TOKEN_ENCRYPTION_KEY }}
            APP_BASE_URL=${{ secrets.APP_BASE_URL }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}