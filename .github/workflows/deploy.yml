name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  SERVICE_NAME: webhook-pipeline-api
  REGION: europe-west1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required so the job can mint the OIDC token WIF exchanges
    steps:
      - uses: actions/checkout@v4

      # Workload Identity Federation: no key file ever touches the runner.
      # See the setup commands from earlier for how WIF_PROVIDER and
      # WIF_SERVICE_ACCOUNT get created.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          source: ./apps/api
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            WEBHOOK_SECRET_GITHUB=${{ secrets.WEBHOOK_SECRET_GITHUB }}