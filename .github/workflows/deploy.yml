name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  SERVICE_NAME: webhook-pipeline-api
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed if you switch to Workload Identity Federation later
    steps:
      - uses: actions/checkout@v4

      # Simplest auth path: a service account key stored as a repo secret.
      # For anything beyond a demo project, prefer Workload Identity
      # Federation instead (google-github-actions/auth supports it) —
      # it avoids a long-lived key sitting in GitHub Secrets entirely.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          source: ./apps/api
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            GITHUB_WEBHOOK_SECRET=${{ secrets.GITHUB_WEBHOOK_SECRET }}
