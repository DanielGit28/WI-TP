name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      # e2e tests spin up their own ephemeral Postgres via Testcontainers
      # (ubuntu-latest runners have Docker preinstalled) and generate their
      # own dummy config in-process — no secrets or services: block needed.
      - run: npm run test:e2e
